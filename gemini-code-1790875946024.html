<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Sistema de gestão profissional — Studio de Pilates LOUISE KARLA — Android e iOS">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="Studio Pilates LOUISE KARLA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio Pilates">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>Studio Pilates LOUISE KARLA — iOS 27 Experience — v83</title>

<script id="chartjs-lazy-loader">
/* Chart.js é carregado somente quando uma tela realmente precisa de gráficos. */
window.__chartJSReady = null;
function ensureChartJS(){
  if(typeof Chart !== "undefined") return Promise.resolve(true);
  if(window.__chartJSReady) return window.__chartJSReady;
  window.__chartJSReady = new Promise(resolve=>{
    const existing=document.querySelector('script[data-chartjs]');
    if(existing){ existing.addEventListener('load',()=>resolve(true),{once:true}); existing.addEventListener('error',()=>resolve(false),{once:true}); return; }
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js';
    script.async=true; script.defer=true; script.dataset.chartjs='1';
    script.onload=()=>resolve(true); script.onerror=()=>resolve(false);
    document.head.appendChild(script);
  });
  return window.__chartJSReady;
}
</script>

<style>
:root{
  --p:#7c3aed;
  --p2:#a78bfa;
  --a:#ec4899;
  --bg:#f2f2f7;
  --card:rgba(255, 255, 255, 0.65);
  --ink:#1c1c1e;
  --muted:#8e8e93;
  --line:rgba(60, 60, 67, 0.12);
  --surface-2:rgba(255, 255, 255, 0.45);
  --surface-3:rgba(118, 118, 128, 0.12);
  --input-bg:rgba(255, 255, 255, 0.5);
  --ok:#34c759;
  --warn:#ff9500;
  --bad:#ff3b30;
  --info:#007aff;
  --wa:#25d366;
  --wa-dark:#128c7e;
  --shadow:0 8px 30px rgba(0,0,0,.06);
  --shadow-lg:0 20px 40px rgba(0,0,0,.12);
  --radius:22px;
  --focus:rgba(124,58,237,.25);
  --ios-spring:cubic-bezier(0.174, 0.885, 0.32, 1.1);
  --ios-blur:blur(32px) saturate(190%);
}

html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000;
  --card:rgba(28, 28, 30, 0.65);
  --ink:#ffffff;
  --muted:#8e8e93;
  --line:rgba(84, 84, 88, 0.35);
  --surface-2:rgba(44, 44, 46, 0.5);
  --surface-3:rgba(118, 118, 128, 0.24);
  --input-bg:rgba(28, 28, 30, 0.5);
  --shadow:0 14px 38px rgba(0,0,0,.5);
  --focus:rgba(167,139,250,.35);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s ease,color .3s ease;
}

button,input,select,textarea{font:inherit;}
html,body{width:100%;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
button,a,input,select,textarea{-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
@media(pointer:coarse){button,.btn,.nav button,.settings-nav button{min-height:44px;} input,select,textarea{min-height:44px;}}

button{cursor:pointer;}

.app{min-height:100vh;display:flex;}

/* SIDEBAR — iOS Glass Panel */
.sidebar{
  width:255px;
  background:var(--card);
  backdrop-filter:var(--ios-blur);
  -webkit-backdrop-filter:var(--ios-blur);
  border-right:1px solid var(--line);
  padding:18px 14px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow:auto;
  z-index:50;
  transition:transform .35s var(--ios-spring);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px;
  margin-bottom:18px;
}

.brand-logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--p),var(--a));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  overflow:hidden;
  flex:none;
  box-shadow:0 8px 16px rgba(124,58,237,.3);
}

.brand-logo img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-weight:800;line-height:1.15;font-size:15px;letter-spacing:-0.02em;}
.brand-sub{color:var(--muted);font-size:11px;margin-top:3px;}

.nav-tools{display:grid;gap:7px;margin:4px 0 10px}
.nav-search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);outline:none;font-size:12px}
.nav-search:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--focus)}
.nav button{position:relative}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--muted);font-size:10px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.nav button.active .nav-badge{background:rgba(255,255,255,.3);color:#fff}
.nav-empty{display:none;padding:9px;color:var(--muted);font-size:11px;text-align:center}

.nav{display:grid;gap:5px;}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--ink);
  opacity:.85;
  text-align:left;
  padding:11px 12px;
  border-radius:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
  transition:all .2s var(--ios-spring);
}

.nav button:hover{
  background:var(--surface-2);
  opacity:1;
  transform:scale(1.02);
}

.nav button:active{
  transform:scale(0.96);
}

.nav button.active{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  opacity:1;
  box-shadow:0 8px 20px rgba(124,58,237,.35);
}

.nav-icon{width:24px;text-align:center;font-size:17px;}

.main{
  margin-left:255px;
  width:calc(100% - 255px);
  min-width:0;
}

/* TOPBAR */
.topbar{
  height:72px;
  background:var(--card);
  backdrop-filter:var(--ios-blur);
  -webkit-backdrop-filter:var(--ios-blur);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.top-title{font-size:19px;font-weight:800;letter-spacing:-0.02em;}
.top-right{display:flex;align-items:center;gap:9px;}
.mobile-menu{display:none;}
.content{padding:24px;max-width:1600px;margin:auto;}

/* PAGES & CARDS */
.page{display:none;}
.page.active{display:block;}
.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
}

.page-title{margin:0;font-size:28px;letter-spacing:-0.03em;font-weight:800;}
.page-sub{color:var(--muted);margin-top:5px;font-size:13px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:var(--ios-blur);
  -webkit-backdrop-filter:var(--ios-blur);
  color:var(--ink);
  border-radius:14px;
  padding:10px 14px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:all .2s var(--ios-spring);
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow);
}

.btn:active{
  transform:scale(0.96);
}

.btn.primary{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(135deg,var(--p),var(--p2));
  box-shadow:0 8px 18px rgba(124,58,237,.3);
}

.card{
  background:var(--card);
  backdrop-filter:var(--ios-blur);
  -webkit-backdrop-filter:var(--ios-blur);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}

.kpi{padding:18px;position:relative;overflow:hidden;border-radius:var(--radius);}
.kpi-label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
.kpi-value{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-0.03em;}

/* FORMS — Native iOS Inputs */
input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--input-bg);
  backdrop-filter:var(--ios-blur);
  -webkit-backdrop-filter:var(--ios-blur);
  color:var(--ink);
  border-radius:14px;
  padding:11px 12px;
  outline:none;
  transition:all .2s ease;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--p);
  box-shadow:0 0 0 4px var(--focus);
}

/* MODAL — iOS Glass Sheet */
.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal-backdrop.show{display:flex;}
.modal{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  backdrop-filter:var(--ios-blur);
  -webkit-backdrop-filter:var(--ios-blur);
  border-radius:28px;
  border:1px solid var(--line);
  box-shadow:0 30px 90px rgba(0,0,0,.3);
  animation:modalSlide .35s var(--ios-spring);
}

@keyframes modalSlide {
  from { transform: translateY(20px) scale(0.95); opacity:0; }
  to { transform: translateY(0) scale(1); opacity:1; }
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:200;
  background:var(--card);
  backdrop-filter:var(--ios-blur);
  -webkit-backdrop-filter:var(--ios-blur);
  border:1px solid var(--line);
  color:var(--ink);
  padding:14px 18px;
  border-radius:18px;
  box-shadow:0 15px 35px rgba(0,0,0,.2);
  transform:translateY(120px);
  opacity:0;
  transition:all .35s var(--ios-spring);
}
.toast.show{transform:translateY(0);opacity:1;visibility:visible;}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">LK</div>
      <div>
        <div class="brand-name">Louise Karla</div>
        <div class="brand-sub">Studio Pilates</div>
      </div>
    </div>
    
    <div class="nav-tools">
      <input type="text" class="nav-search" placeholder="Buscar no sistema...">
    </div>

    <nav class="nav">
      <button class="active">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </button>
      <button>
        <span class="nav-icon">📅</span>
        <span>Agenda</span>
      </button>
      <button>
        <span class="nav-icon">👥</span>
        <span>Alunos</span>
      </button>
      <button>
        <span class="nav-icon">💰</span>
        <span>Financeiro</span>
      </button>
      <button>
        <span class="nav-icon">⚙️</span>
        <span>Ajustes</span>
      </button>
    </nav>
  </aside>

  <!-- MAIN CONTAINER -->
  <main class="main">
    <header class="topbar">
      <div class="top-title">Painel Geral</div>
      <div class="top-right">
        <button class="btn primary">
          <span>+ Novo Agendamento</span>
        </button>
      </div>
    </header>

    <div class="content">
      <div class="page active">
        <div class="page-head">
          <div>
            <h1 class="page-title">Bem-vinda de volta</h1>
            <div class="page-sub">Visão geral do estúdio para hoje</div>
          </div>
          <div class="actions">
            <button class="btn">Relatório</button>
            <button class="btn primary">Exportar</button>
          </div>
        </div>

        <div class="grid grid-4">
          <div class="card kpi">
            <div class="kpi-label">Atendimentos Hoje</div>
            <div class="kpi-value">24</div>
          </div>
          <div class="card kpi">
            <div class="kpi-label">Alunos Ativos</div>
            <div class="kpi-value">142</div>
          </div>
          <div class="card kpi">
            <div class="kpi-label">Ocupação</div>
            <div class="kpi-value">88%</div>
          </div>
          <div class="card kpi">
            <div class="kpi-label">Faturamento Mês</div>
            <div class="kpi-value">R$ 18.400</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
